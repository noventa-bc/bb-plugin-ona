# On a push to main (or by hand): if package.json's version has no GitHub
# release yet, tag it `v<version>` at the pushed commit and create the release
# with generated notes (the PR titles merged since the previous tag).
name: release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
# Two quick pushes run one after the other; the second sees the release and exits.
concurrency: { group: release }
jobs:
  release:
    # A manual run on another branch must never tag it.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version already released"; exit 0
          fi
          # Creates the tag at this commit when it does not exist; an existing tag is kept where it is.
          gh release create "v$version" --target "$GITHUB_SHA" --title "v$version" --generate-notes
