# Runs only when Markdown changes. check.yml skips those, so any job that
# validates .md files (format, links, line limits) belongs here.
name: docs
on:
  push:
    branches: [main]
    paths: ["**.md"]
  pull_request:
    paths: ["**.md"]
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --check "**/*.md"
      # The limits AGENTS.md and FACTORY.md set for themselves.
      - run: |
          for f in AGENTS.md FACTORY.md; do
            n=$(wc -l < "$f")
            [ "$n" -le 300 ] || { echo "$f has $n lines; the limit is 300"; exit 1; }
          done
      # Relative Markdown links point at files that exist.
      - run: |
          dead=0
          for f in $(find . -name '*.md' -not -path './node_modules/*' -not -path './.claude/*'); do
            for t in $(grep -oE '\]\([^)#]+' "$f" | sed 's/^](//' | grep -vE '^(https?:|mailto:)'); do
              [ -e "$(dirname "$f")/$t" ] || { echo "$f: dead link $t"; dead=1; }
            done
          done
          exit $dead
