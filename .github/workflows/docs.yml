# Runs only when Markdown changes. check.yml skips those, so any job that
# validates .md files (format, links, line limits) belongs here.
name: docs
on:
  push:
    branches: [main]
    paths: ["**.md"]
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths: ["**.md"]
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The base branch, for the title and version gate below.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      # Same gate as check.yml: a Conventional Commit title and no version bump for a Markdown-only change.
      - if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.base_ref }}
        run: scripts/release-check.sh "origin/$BASE"
      # Prettier, the line limits and the relative links; the pre-commit hook runs the same script.
      - run: scripts/docs-check.sh
