# Runs only when Markdown changes. check.yml skips those, so any job that
# validates .md files (format, links, line limits) belongs here.
name: docs
on:
  push:
    branches: [main]
    paths: ["**.md"]
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths: ["**.md"]
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The base branch, for the title and version gate below.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      # Same gate as check.yml: a Conventional Commit title and no version bump for a Markdown-only change.
      - if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.base_ref }}
        run: scripts/release-check.sh "origin/$BASE"
      - run: npx prettier --check "**/*.md"
      # The limits AGENTS.md and FACTORY.md set for themselves.
      - run: |
          for f in AGENTS.md FACTORY.md; do
            n=$(wc -l < "$f")
            [ "$n" -le 300 ] || { echo "$f has $n lines; the limit is 300"; exit 1; }
          done
      # Relative Markdown links point at files that exist. Fenced blocks and inline code are
      # skipped so link examples do not count. Paths with parentheses are not supported.
      - run: |
          dead=0
          while IFS= read -r f; do
            while IFS= read -r t; do
              [ -e "$(dirname "$f")/$t" ] || { echo "$f: dead link $t"; dead=1; }
            done < <(sed '/^```/,/^```/d; s/`[^`]*`//g' "$f" | grep -oE '\]\([^)#]+' | sed 's/^](//' | grep -vE '^(https?:|mailto:)')
          done < <(find . -name '*.md' -not -path './node_modules/*' -not -path './.claude/*')
          exit $dead
