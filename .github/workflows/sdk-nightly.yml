name: sdk-nightly
on:
  # Daily at 04:17 UTC, off the hour to avoid the start-of-hour queue.
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  typecheck-latest-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Don't leave the job's token in .git/config for dependencies to read.
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # Exactly the lockfile, and no dependency install scripts: nothing here
      # needs a native build, and install scripts are the usual supply-chain route.
      - run: npm ci --ignore-scripts
      # Swap the pinned SDK for the newest one, without touching the lockfile,
      # to see a breaking SDK change before the pin is bumped.
      - run: npm install --no-save --ignore-scripts @get-bb/plugin-sdk@latest
      # `npm ls` exits 1 when the installed version differs from the pin.
      - run: npm ls @get-bb/plugin-sdk || true
      - run: npm run typecheck
