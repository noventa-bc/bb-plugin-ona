name: check
on:
  # Markdown-only changes skip this workflow; docs.yml checks them.
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
permissions:
  contents: read
jobs:
  check:
    # Ubuntu for speed, macOS because that is where the plugin runs. Pinned images:
    # the -latest labels move on their own (checked 2026-10-30); Dependabot bumps these.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Don't leave the job's token in .git/config for dependencies to read.
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # Exactly the lockfile, and no dependency install scripts: nothing here
      # needs a native build, and install scripts are the usual supply-chain route.
      - run: npm ci --ignore-scripts
      - run: npm run check
      # Preinstalled on the Ubuntu runner only.
      - if: runner.os == 'Linux'
        run: shellcheck scripts/*.sh test/*.sh
