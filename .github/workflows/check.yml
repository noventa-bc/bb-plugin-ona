name: check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    # Ubuntu for speed, macOS because that is where the plugin runs.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Don't leave the job's token in .git/config for dependencies to read.
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # Exactly the lockfile, and no dependency install scripts: nothing here
      # needs a native build, and install scripts are the usual supply-chain route.
      - run: npm ci --ignore-scripts
      - run: npm run check
      # Preinstalled on the Ubuntu runner only.
      - if: runner.os == 'Linux'
        run: shellcheck scripts/*.sh test/*.sh
