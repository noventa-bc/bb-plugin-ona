name: check
on:
  # Markdown-only changes skip this workflow; docs.yml checks them.
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths-ignore: ["**.md"]
permissions:
  contents: read
jobs:
  check:
    timeout-minutes: 10
    # Pinned image: the -latest label moves on its own (checked 2026-10-30); bump it by hand, Dependabot does not watch runner labels.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # Don't leave the job's token in .git/config for dependencies to read.
          persist-credentials: false
          # The base branch, for the commit and version checks below.
          fetch-depth: 0
      # Pinned to the exact LTS (checked 2026-11-03); bump by hand, Dependabot does not watch .nvmrc.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # PR title and commits are Conventional Commits; the version moved as the title requires.
      # Title, body and base go through env, never into the script text.
      - if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.base_ref }}
        run: scripts/release-check.sh "origin/$BASE"
      # Exactly the lockfile, and no dependency install scripts: nothing here
      # needs a native build, and install scripts are the usual supply-chain route.
      - run: npm ci --ignore-scripts
      - run: npm run check
      # The architecture numbers must equal scripts/fitness-baseline.txt (AGENTS.md Commands).
      - run: scripts/fitness.sh --check
      # The personal-path check on the checkout (AGENTS.md rule 10).
      - run: scripts/leak-check.sh
      # Every src module has a test file. rpc.ts is a zod contract with no logic.
      - run: |
          for f in $(find src -name '*.ts'); do
            n=$(basename "$f" .ts)
            case "$n" in rpc) continue ;; esac
            [ -f "test/$n.test.ts" ] || { echo "$f has no test/$n.test.ts"; exit 1; }
          done
      - run: shellcheck scripts/*.sh test/*.sh .githooks/*
      # The rules in .semgrep/rules.yml: first their own fixtures (.semgrep/rules.ts), then the plugin code.
      # pipx is preinstalled; Ubuntu 24.04's system Python refuses a bare pip install.
      # 1.183.0 is the newest PyPI release at pin time (checked 2026-10-30); bump it by hand because Dependabot does not watch pipx pins.
      - run: pipx install semgrep==1.183.0
      - run: semgrep --test --metrics=off .semgrep/
      - run: semgrep scan --config .semgrep/rules.yml --error --metrics=off app.tsx server.ts src
