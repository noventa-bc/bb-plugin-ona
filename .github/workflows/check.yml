name: check
on:
  # Markdown-only changes skip this workflow; docs.yml checks them.
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
permissions:
  contents: read
jobs:
  check:
    # Ubuntu for speed, macOS because that is where the plugin runs. Pinned images:
    # the -latest labels move on their own (checked 2026-10-30); Dependabot bumps these.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Don't leave the job's token in .git/config for dependencies to read.
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # Exactly the lockfile, and no dependency install scripts (the usual supply-chain
      # route), except better-sqlite3's: the SDK's fake plugin host imports it at load, so
      # `rebuild` runs that one package's install (prebuild-install) and nothing else's.
      - run: npm ci --ignore-scripts
      - run: npm rebuild better-sqlite3
      - run: npm run check
      # Preinstalled on the Ubuntu runner only.
      - if: runner.os == 'Linux'
        run: shellcheck scripts/*.sh test/*.sh
      # The rules in .semgrep/rules.yml: first their own fixtures (.semgrep/rules.ts), then the plugin code.
      # pipx is preinstalled; Ubuntu 24.04's system Python refuses a bare pip install.
      # 1.183.0 is the newest PyPI release at pin time (checked 2026-10-30); bump it by hand because Dependabot does not watch pipx pins.
      - if: runner.os == 'Linux'
        run: pipx install semgrep==1.183.0
      - if: runner.os == 'Linux'
        run: semgrep --test --metrics=off .semgrep/
      - if: runner.os == 'Linux'
        run: semgrep scan --config .semgrep/rules.yml --error --metrics=off app.tsx server.ts src
